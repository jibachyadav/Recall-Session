# Builds the installers on GitHub's computers. Runs on every push to main (to catch breakage), and when you
# push a tag like v0.1.0 it also publishes a GitHub Release with the downloads attached.
name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04     # an older Ubuntu, so the packages run on newer ones too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y python3-tk libfuse2 fakeroot
      - name: Build .deb, AppImage and tar.gz
        run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist-packages/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer and zip
        shell: powershell
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          powershell -File packaging\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist-packages/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          prerelease: true        # beta: the Windows version has not been tried on a real PC yet
